# @package _global_
# Changes specified in this config should be interpreted as relative to the _global_ package.
hyperopt_criterion: 'eval/mean_reward'

algorithm:
  gamma: 0.99
  batch_size: 64
hydra:
  sweeper:
    study_name: dqn_moonlander_collect
    max_trials: 100
    # DQN cannot handle 10 jobs at the same time -> reduce to 1
    n_jobs: 1
    direction: maximize
    max_duration_minutes: 600
    min_trials_per_param: 2
    max_trials_per_param: 5
    search_space:
      ++algorithm.learning_rate:
        type: float
        low: 0.00005
        high: 0.005
        log: true
      ++algorithm.gamma:
        type: float
        low: 0.95
        high: 0.99
